name: iOS IPA with AdMob (unsigned, manual)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - name: Use Xcode 16 (needed by Google Mobile Ads SDK 12)
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - uses: actions/checkout@v4

      - name: Install Godot 4.3 + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Write iOS export preset
        run: |
          cat > export_presets.cfg <<'EOT'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/CoDriverRally.ipa"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          architectures/arm64=true
          application/app_store_team_id="0000000000"
          application/bundle_identifier="com.codriver.rally"
          application/short_version="1.0"
          application/version="1.0"
          application/targeted_device_family=2
          application/min_ios_version="15.0"
          plugins/AdMob=true
          user_data/accessible_from_files_app=true
          user_data/accessible_from_itunes_sharing=true
          storyboard/use_custom_bg_color=true
          storyboard/custom_bg_color=Color(0.03, 0.03, 0.04, 1)
          application/export_project_only=true
          application/code_sign_identity_debug=""
          application/code_sign_identity_release=""
          application/provisioning_profile_uuid_debug=""
          application/provisioning_profile_uuid_release=""
          EOT

      - name: Add AdMob plugin (Godot 4.3 build, v3.1.5)
        run: |
          mkdir -p ios/plugins _dl
          curl -fL --retry 3 -o _dl/admob.zip "https://github.com/poingstudios/godot-admob-ios/releases/download/v3.1.5/poing-godot-admob-ios-v4.3.0.zip"
          unzip -q _dl/admob.zip -d _dl/x
          cp -R _dl/x/ads/. ios/plugins/
          cp ios_admob/poing-godot-admob-ads.gdip ios/plugins/poing-godot-admob-ads.gdip
          find ios/plugins -maxdepth 3 | head -20
          rm -rf _dl

      - name: Import project
        run: godot --headless --import || true

      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          godot --headless --verbose --export-release "iOS" build/ios/CoDriverRally.ipa
          find build/ios -maxdepth 2 | head -50

      - name: Add local-network permission (needed for LAN play)
        run: |
          PLIST=$(find build/ios -name "*-Info.plist" | head -1)
          echo "Info.plist: $PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Used to find and join LAN games.'" "$PLIST" || true

      - name: Install Google Mobile Ads SDK (CocoaPods)
        run: |
          PROJ=$(find build/ios -maxdepth 2 -name "*.xcodeproj" | head -1)
          DIR=$(dirname "$PROJ")
          NAME=$(basename "$PROJ" .xcodeproj)
          echo "Project: $PROJ"
          TARGET=$(xcodebuild -list -project "$PROJ" -json | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['targets'][0])")
          echo "Target: $TARGET"
          cd "$DIR"
          cat > Podfile <<EOF
          platform :ios, '15.0'
          target '$TARGET' do
            pod 'Google-Mobile-Ads-SDK', '12.14.0'
          end
          EOF
          cat Podfile
          pod install --repo-update
          ls

      - name: Build unsigned app
        run: |
          WS=$(find build/ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS  Scheme: $SCHEME"
          ls build/ios
          build() {
            xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
              -sdk iphoneos -destination "generic/platform=iOS" \
              -archivePath build/app.xcarchive archive \
              IPHONEOS_DEPLOYMENT_TARGET=15.0 \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              STRIP_INSTALLED_PRODUCT=NO COPY_PHASE_STRIP=NO STRIP_STYLE=debugging
          }
          if ! build; then
            echo "=== First build failed. Downloading iOS platform and retrying ==="
            sudo xcodebuild -downloadPlatform iOS
            build
          fi

      - name: Name the crash frames (diagnostic only)
        continue-on-error: true
        run: |
          BIN=$(ls build/app.xcarchive/Products/Applications/*.app/CoDriverRally)
          echo "binary: $BIN"
          otool -l "$BIN" | grep -A4 "segname __TEXT" | head -8
          nm -n "$BIN" 2>/dev/null | grep -i " [tT] " > /tmp/syms.txt || true
          wc -l /tmp/syms.txt
          python3 - <<'PY'
          import bisect, subprocess
          rows=[]
          for l in open('/tmp/syms.txt'):
              a=l.split()
              if len(a)>=3:
                  try: rows.append((int(a[0],16),a[2]))
                  except: pass
          addrs=[r[0] for r in rows]
          base=0x100000000
          offs=[44195576,17617284,17616992,8094748,7603728,8094332,44205924,41588088,44215688,19362620,46425840,799432,800444,1203784,1202580,1199632,850100,849680,847420]
          for o in offs:
              i=bisect.bisect_right(addrs,base+o)-1
              name=rows[i][1] if i>=0 else '?'
              d=subprocess.run(['c++filt',name],capture_output=True,text=True).stdout.strip() or name
              print(o, hex(o), d[:200])
          PY

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          # iOS 15+ ships Swift concurrency itself; a bundled copy crashes at launch (dyld: libswiftCore not found)
          rm -f Payload/*.app/Frameworks/libswift*.dylib
          rmdir Payload/*.app/Frameworks 2>/dev/null || true
          zip -qr CoDriverRally-AdMob.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CoDriverRally-AdMob-ipa
          path: CoDriverRally-AdMob.ipa
