name: iOS IPA (Godot 4.7 test)

on:
  push:
    branches: [godot-4.7]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode (Godot 4.7 needs the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version

      - name: Install Godot 4.7.2 + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Write iOS export preset
        run: |
          cat > export_presets.cfg <<'EOT'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/CoDriverRally.ipa"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          architectures/arm64=true
          application/app_store_team_id="0000000000"
          application/bundle_identifier="com.codriver.rally"
          application/short_version="1.0"
          application/version="1.0"
          application/targeted_device_family=2
          application/export_project_only=true
          application/code_sign_identity_debug=""
          application/code_sign_identity_release=""
          application/provisioning_profile_uuid_debug=""
          application/provisioning_profile_uuid_release=""
          EOT

      - name: Import project
        run: godot --headless --import || true

      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          godot --headless --verbose --export-release "iOS" build/ios/CoDriverRally.ipa
          find build/ios -maxdepth 2 | head -50

      - name: Add local-network permission (needed for LAN play)
        run: |
          PLIST=$(find build/ios -name "*-Info.plist" | head -1)
          echo "Info.plist: $PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Used to find and join LAN games.'" "$PLIST" || true

      - name: Build unsigned app
        run: |
          PROJ=$(find build/ios -maxdepth 2 -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "Project: $PROJ  Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -archivePath build/app.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -qr CoDriverRally.ipa Payload

      - name: Publish to Releases (no Actions storage quota)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test47-ios >/dev/null 2>&1 || gh release create test47-ios --title "iOS IPA - Godot 4.7 TEST" --notes "Experimental build on Godot 4.7.2" --prerelease
          gh release upload test47-ios CoDriverRally.ipa --clobber

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: CoDriverRally-ipa
          path: CoDriverRally.ipa
          retention-days: 2
