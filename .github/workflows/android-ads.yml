name: Android APK + Ads (test)

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.3 + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      - name: Write Android export preset (gradle build)
        run: |
          cat > export_presets.cfg <<'EOT'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/HairpinRush.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=true
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="34"
          package/unique_name="com.codriver.rally"
          package/name="Hairpin Rush"
          package/signed=true
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          screen/immersive_mode=true
          permissions/internet=true
          permissions/access_network_state=true
          permissions/access_wifi_state=true
          permissions/change_wifi_multicast_state=true
          EOT

      - name: Debug keystore + Godot editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Prepare gradle build template
        run: |
          mkdir -p android/build
          T=$(find ~/.local/share/godot/export_templates -name android_source.zip | head -1)
          echo "template: $T"
          unzip -q "$T" -d android/build
          echo -n "4.3.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Add AdMob plugin (v4.1.0 for Godot 4.3)
        run: |
          mkdir -p _dl android/build/libs/debug android/build/libs/release
          curl -fL --retry 3 -o _dl/admob.zip "https://github.com/poingstudios/godot-admob-android/releases/download/v4.1.0/poing-godot-admob-android-v4.3.0.zip"
          unzip -q _dl/admob.zip -d _dl/x
          cp _dl/x/ads/libs/*-debug.aar android/build/libs/debug/
          cp _dl/x/ads/libs/*-release.aar android/build/libs/release/
          ls -R android/build/libs
          cd android/build
          # AdMob SDK + AndroidX dependencies
          python3 - <<'PY'
          p='build.gradle'
          s=open(p).read()
          dep='''dependencies {
              implementation "com.google.android.gms:play-services-ads:24.9.0"
              implementation "androidx.appcompat:appcompat:1.7.1"
              implementation "com.google.android.material:material:1.13.0"
          '''
          s=s.replace('dependencies {',dep,1)
          open(p,'w').write(s)
          m='AndroidManifest.xml'
          x=open(m).read()
          meta='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
          x=x.replace('</application>',meta+'\n    </application>',1)
          open(m,'w').write(x)
          PY
          grep -n "play-services-ads" build.gradle
          grep -n "APPLICATION_ID" AndroidManifest.xml

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/HairpinRush.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HairpinRush-Android-apk
          path: build/android/HairpinRush.apk
